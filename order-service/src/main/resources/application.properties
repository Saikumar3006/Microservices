spring.application.name=order-service
# Port 3307, not 3306: MySQL runs in Docker and is published on 3307 because a
# native Homebrew MySQL already holds 3306 on this machine.
# The driver-class-name line was removed - it named the long-removed
# com.mysql.jdbc.Driver, and Boot infers the right driver from the URL anyway.
spring.datasource.url=jdbc:mysql://localhost:3307/order-service
# Not root: db/init/01-create-app-user.sql creates this account with rights on
# the order-service database only, so a bug here cannot reach another schema.
spring.datasource.username=orderuser
spring.datasource.password=orderpass

# Was "spring.jps..." - a typo, and unknown property keys are ignored silently,
# so this never took effect and Hibernate never created the tables.
#
# "none" = Hibernate does nothing to the schema at all: it neither changes it
# nor inspects it. Flyway (see db/migration) is the single source of truth for
# what the tables look like.
spring.jpa.hibernate.ddl-auto=none

# Log the SQL Hibernate generates - useful for seeing the @OneToMany insert.
spring.jpa.show-sql=true

server.port=8081

