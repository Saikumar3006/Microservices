spring.application.name=inventory-service

# Port 8082. product-service is on 8080, order-service on 8081.
server.port=8082

# Its OWN database on the shared MySQL server - not order-service's. Each
# service owns its data; no service reads another's tables directly. That
# boundary is what lets them change independently.
# Host port 3307 because native Homebrew MySQL holds 3306 on this machine.
spring.datasource.url=jdbc:mysql://localhost:3307/inventory-service
spring.datasource.username=inventoryuser
spring.datasource.password=inventorypass

# --- Flyway owns everything about the schema AND the seed data ---
# Both the CREATE TABLE (V1) and the starting stock rows (V2) are versioned
# SQL files under db/migration. Nothing is created by Hibernate, and nothing
# is inserted by hand - a fresh clone gets identical tables and identical data.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# none = Hibernate does nothing to the schema at all: it neither changes it nor
# inspects it. Flyway is the single source of truth for what the tables look like.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
